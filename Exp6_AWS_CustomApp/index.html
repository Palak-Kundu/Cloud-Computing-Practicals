<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Counter App</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin-top: 120px;
            background-color: #ffffff;
            color: #000000;
        }
        h1 {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
        }
        #counter-value {
            font-size: 64px;
            font-weight: bold;
            margin: 40px 0;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-top: 30px;
        }
        button {
            font-size: 20px;
            padding: 15px 35px;
            border: 1px solid #999999;
            background-color: #f0f0f0;
            cursor: pointer;
            border-radius: 2px;
        }
        button:hover {
            background-color: #e4e4e4;
        }
        button:active {
            background-color: #d4d4d4;
        }
    </style>
</head>
<body>
    <h1>Simple Counter App</h1>
    <div id="counter-value">2</div>
    <div class="button-container">
        <button onclick="increment()">Increment</button>
        <button onclick="decrement()">Decrement</button>
    </div>

    <script>
        let count = 2;
        const counterDisplay = document.getElementById('counter-value');

        function increment() {
            count++;
            counterDisplay.textContent = count;
        }

        function decrement() {
            count--;
            counterDisplay.textContent = count;
        }
    </script>
</body>
</html>
